ionsunternehmen aus Hof mit Kooperationen im Stückgutbereich, starken Partnern und eigenem Fuhrpark.\n\nWir suchen zum Ausbildungsstart am 01.09.2026:\n\n**Auszubildenden zum Fachinformatiker für Anwendungsentwicklung (m/w/d)**\n\nAls Fachinformatiker arbeitest Du bei uns in einem starken, dynamischen Team mit modernen Werkzeugen an der digitalen Zukunft des Unternehmens.\nWährend auf dem Hof der LKW ordnungsgemäß beladen wird, muss durch die IT sichergestellt sein, dass alle nötigen Daten für Disposition, Fahrer und Empfangspartner bereitstehen.\nIn deinem Tagesgeschäft konzipierst und entwickelst du nicht nur Softwarelösungen, sondern begleitest diese auch direkt in der Praxis.\n\n**Während Deiner 3-jährigen Ausbildung entwickelst du dich in folgenden Bereichen:**\n\n- Weiterentwicklung von Softwareprojekten mittels moderner Programmiersprachen \n- Umgang mit Datenbanken und Linux-Servern \n- Enge Zusammenarbeit mit anderen Teams (Projektmanagement, Administration, andere Entwicklerteams, operative Abteilungen) \n- Und vieles mehr... \n\n**Was wir von Dir erwarten:**\n\n- Begeisterung für IT \n- Abstraktes Denkvermögen \n- Lösungsorientiertes Arbeiten \n- Guter, humorvoller Umgangston \n- Mindestens mittlere Reife \n- Praktische Erfahrung (durch z.B. eigene Projekte/Praktika) von Vorteil \n- Denken am Puls der Zeit \n\n**Was wir Dir bieten:**\n\n- Kontakte knüpfen leicht gemacht - Einführungstag mit allen neu eingestellten Auszubildenden \n- Fester Ansprechpartner/Ausbildungsverantwortlicher in deiner Abteilung \n- Eigener Arbeitsplatz mit moderner Hardware \n- Ein Arbeitsumfeld mit kurzen Entscheidungswegen sowie hilfsbereiten und freundlichen Kollegen \n- Mitarbeiter-Benefits-Programm \n- zahlreiche Firmenevents (Ostergrillen, Sonnwendfeier, Weihnachtsfeier, ...) zur Stärkung des WIR-Gefühls\n\nHaben wir dein Interesse geweckt und möchten du Teil des #TeamGüttler werden? Wir freuen uns auf deine aussagekräftige Bewerbung, bevorzugt per E-Mail an Sandra Köppel \\ ogrammiersprachen C/AL oder AL nutzt, die speziell für Dynamics 365 Business Central entwickelt wurden. Neben der Anpassung und Erweiterung von Standardfunktionalitäten umfasst dies auch die Implementierung von maßgeschneiderten Modulen.\n\nDu wirst ebenfalls mit der Konzeption und Implementierung von Datenbankstrukturen betraut, um eine effiziente Datenverwaltung sicherzustellen. Die Gewährleistung der Funktionalität deiner erstellten Anwendungen durch umfassende Tests und das Beheben von etwaigen Fehlern sind Bestandteile deiner Aufgaben. Des Weiteren fällt die Erstellung von Entwicklungs- und Benutzerdokumentationen in deinen Aufgabenbereich.\n\nDie Kundenbetreuung bildet einen weiteren Aspekt deiner Tätigkeiten, indem du Endbenutzern Unterstützung anbietest und Ihnen deine entwickelten Funktionalitäten nahebringst. \n\n## Was erwartet Dich während der Ausbildung?\n\nDer schulische Teil der Ausbildung findet tageweise an einer Berufsschule in Osnabrück statt. Hier lernst Du die theoretischen Grundlagen für die Arbeit als Anwendungsentwickler. An deinen Arbeitstagen bekommst du bereits deine ersten Projektaufgaben zugeteilt, bei denen Dich dein Mentor bei Fragen immer unterstützt.\n\n## Was erwartet dich auf dem Jupiter?\n\n### Wir bilden Dich aus, um Dich zu übernehmen.\n\nDeswegen bereiten wir Dich konsequent auf das Arbeitsleben vor, schulen Dich entsprechend und werden Dir nach und nach mehr Verantwortung übertragen. Dein Pate, welcher Dir während Deiner gesamten Ausbildungszeit zur Seite steht, wird Dich dabei unterstützen und Dir aufkommende Fragen beantworten. Wenn Du besondere Vorkenntnisse hast oder mit guten Leistungen glänzt, geben wir Dir gerne die Möglichkeit, Deine Ausbildung zu verkürzen.\n\n## Bewerberprofil\n\n## Folgende Qualifikationen wünschen wir uns von unseren Kandidaten\n\n- Du hast Dein (Fach-)Abitur in der Tasche oder verfügst über einen qualifizierten Realschulabschluss mit gutem bis sehr guten Notendurchschnitt\n- Zu Deinen Stärken gehört logisches Denken\n- Du bist sorgfältig und strukturiert\n- Du interessierst Dich für die IT, bestenfalls hast du schon erste Erfahrungen in der Informatik oder beim Entwickeln gemacht\n- Du besitzt einen Führerschein der Klasse B", "gaji": "", "persyaratan": "Als Auszubildender im Bereich Fachinformatik für Anwendungsentwicklung, mit Fokus auf Microsoft Dynamics 365 Business Central, liegt eine breite Palette von Aufgaben vor dir. Dies beinhaltet die detaillierte Analyse der betrieblichen Abläufe, die Interaktion mit verschiedenen Ansprechpartnern zur Erfassung präziser Anforderungen und die Identifikation von Optimierungsmöglichkeiten in bestehenden Systemen.\nMittlere Reife / Realschulabschluss", "jenis_ausbildung": "Ausbildung | Fachinformatiker/in - Anwendungsentwicklung", "deskripsi_perusahaan": "## Aufgabenbereich", "apa_yang_ditawarkan": "", "link_website_perusahaan": "http://www.arbeitsagentur.de", "alamat_email_bewerbung": "", "link_bewerbung": "", "kontak_penanggung_jawab": "Als Auszubildender im Bereich Fachinformatik für Anwendungsentwicklung, mit Fokus auf Microsoft Dynamics 365 Business Central, liegt eine breite Palette von Aufgaben vor dir. Dies beinhaltet die detaillierte Analyse der betrieblichen Abläufe, die Interaktion mit verschiedenen Ansprechpartnern zur Erfassung präziser Anforderungen und die Identifikation von Optimierungsmöglichkeiten in bestehenden Systemen.", "dokumen_yang_harus_dipenuhi": "", "ba_job_url": "https://www.arbeitsagentur.de/jobsuche/jobdetail/10001-1003176499-S", "scraped_at": "2026-06-11T08:06:48.975866+00:00"}, {"referenznummer": "10000-1206386612-S", "category_id": "fachinformatiker_ae", "nama_perusahaan": "KRONE Business Center DigITAL GmbH & Co. KG", "titik_data_di_peta": "52.8499391,7.6621147", "posisi_kota": "Werlte, Emsland", "alamat_detail": "49757 Werlte, Emsland", "detail_deskripsi": "Als Teil der KRONE Gruppe leisten wir innovative und zuverlässige Unterstützung im Arbeitsfeld IT und Rechnungswesen. Mitarbeiter (m/w/d) haben bei uns den nötigen Raum für Kreativität, Eigeninitiative und Entfaltung. Weltweit mehr als 5.000 Mitarbeiter (m/w/d) gehören zum aktuellen KRONE Team. Hochmotiviert und dynamisch tragen wir alle mit unseren Taten und Talenten zur heutigen und zukünftigen KRONE Erfolgsstory bei.\n\nVerstärke unser Team und finden Sie Ihren Platz bei der Krone Business Center GmbH & Co. KG an unserem Standort in Spelle, Werlte und Hselünne ab dem 01.08.2027 als\n\nAuszubildender zum **Fachinformatiker für Anwendungsentwicklung (m/w/d)**\n\nAls Fachinformatiker für Awendungsentwicklung (m/w/d) bei KRONE bekommst Du die Grundlagen der Informatik vermittelt und arbeitest in einem der größten IT-Systemhäuser der Region. Du durchläufst verschiedene Abteilungen und lernst so die ganze Bandbreite betriebsinterner und kundenorientierter Softwarelösungen kennen. Ob es um die Verbesserung der Datenverwaltung geht oder um Content-Managment-Systeme. Du bist Ansprechpartner für unsere Mitarbeiter und Kunden und unterstützt in allen Belangen.\n\n**Dauer der Ausbildung**\n\n- 3 Jahre\n\n**Du lernst**\n\n- Durchführung von Tests bei bestehenden Anwendungen\n- Anpassung von Programmen\n- Fehlerbehebung und Fehleranalyse\n- Dokumentation von Lösungen\n- First-Level-Support im Bereich betriebliche Anwendungssysteme \n\n**Mögliches Einsatzgebiet während der Ausbildung**\n\n- Portale & eCommerce\n- IT-Security\n- SAP-Entwicklung\n- SAP-Produktionslogistik\n\nDa das KRONE Business Center für die IT in der gesamten KRONE Gruppe zuständig ist, kann es temporär zu Einsätzen an verschiedenen Standorten kommen, allerdings ist der einstellende Standort der Hauptstandort.\n\n**Du bringst mit**\n\n- Realschulabschluss\n- Gute Noten in Mathematik und Englisch\n- Kommunikatives Auftreten\n- Selbstständiges und verantwortungsbewusstes Arbeiten\n\n**Mögliche Berufsschulstandorte**\n\n- Nordhorn\n- Papenburg\n- Meppen\n\nFür Deine Bewerbung nutze bitte unser Online- Bewerbungsformular unter www.krone.de/karriere.", "gaji": "", "persyaratan": "**Du bringst mit**\nMittlere Reife / Realschulabschluss", "jenis_ausbildung": "Ausbildung | Fachinformatiker/in - Anwendungsentwicklung", "deskripsi_perusahaan": "Als Teil der KRONE Gruppe leisten wir innovative und zuverlässige Unterstützung im Arbeitsfeld IT und Rechnungswesen. Mitarbeiter (m/w/d) haben bei uns den nötigen Raum für Kreativität, Eigeninitiative und Entfaltung. Weltweit mehr als 5.000 Mitarbeiter (m/w/d) gehören zum aktuellen KRONE Team. Hochmotiviert und dynamisch tragen wir alle mit unseren Taten und Talenten zur heutigen und zukünftigen KRONE Erfolgsstory bei.", "apa_yang_ditawarkan": "", "link_website_perusahaan": "http://www.arbeitsagentur.de", "alamat_email_bewerbung": "", "link_bewerbung": "", "kontak_penanggung_jawab": "Als Fachinformatiker für Awendungsentwicklung (m/w/d) bei KRONE bekommst Du die Grundlagen der Informatik vermittelt und arbeitest in einem der größten IT-Systemhäuser der Region. Du durchläufst verschiedene Abteilungen und lernst so die ganze Bandbreite betriebsinterner und kundenorientierter Softwarelösungen kennen. Ob es um die Verbesserung der Datenverwaltung geht oder um Content-Managment-Systeme. Du bist Ansprechpartner für unsere Mitarbeiter und Kunden und unterstützt in allen Belangen.", "dokumen_yang_harus_dipenuhi": "", "ba_job_url": "https://www.arbeitsagentur.de/jobsuche/jobdetail/10000-1206386612-S", "scraped_at": "2026-06-11T08:06:49.295049+00:00"}, {"referenznummer": "10000-1206518499-S", "category_id": "fachinformatiker_ae", "nama_perusahaan": "RTRC GmbH", "titik_data_di_peta": "52.484436,7.33185", "posisi_kota": "Lingen (Ems)", "alamat_detail": "Am Seitenkanal 8, 49811 Lingen (Ems)", "detail_deskripsi": "ROSEN Mitarbeiterinnen und Mitarbeiter besitzen die Leidenschaft für Technologien und Innovationen. Unser Claim „empowered by technology“ ist der Schlüssel zu unseren herausragenden und einzigartigen Produkten und Dienstleistungen, sowohl in der Öl und Gas - als auch in verschiedensten anderen Industrien. Im Fokus unserer Forschung und unserer Lösungen steht der sichere Betrieb von industriellen Anlagen – zum Schutz von Mensch und Umwelt.\n\nWir suchen für das Ausbildungsjahr 2027 engagierte und zuverlässige Auszubildende für den Ausbildungsberuf **Fachinformatiker für Anwendungsentwicklung (m/w/d),** mit Spaß an selbstständiger und eigenverantwortlicher Arbeit.\n\n**Das erwartet Dich**\n\nDu bist Feuer und Flamme, wenn es um Technik, Coden oder kreative Problemlösungen geht? Dann ist der Ausbildungsberuf  **Fachinformatiker für Anwendungsentwicklung (m/w/d)&#8239;**genau das richtige für dich.\n\nIn **drei Jahren** wirst du in Sachen Anwendungsentwicklung fit gemacht und beherrscht nicht nur die Konzeptionierung und Programmierung objektorientierter Anwendungen, sondern auch das Design und die Entwicklung von Datenbanken.\n\n**Das lernst du bei uns:&#160;**\n\n- Du analysierst, dokumentierst und verbesserst bestehende und neue Anwendungen\n- Du erstellst Unit- und Integrationstests und wendest sie an\n- Du erweiterst bzw. passt die Anwendungsentwicklung bestehender kundenspezifischer Informations- und Kommunikationssysteme an\n- Du lernst, vielfältige Entwurfsmuster zu beherrschen\n- Du machst dich mit der Nutzung von Versionsverwaltungssystemen vertraut\n- Du wirst Profi, wenn es um die Behebung von Störungen geht.\n\n**Das bringst Du mit**\n\n✌️Du hast einen **guten Realschulabschluss** oder Abitur und interessierst dich für Softwareentwicklung und Betriebssysteme.\n✨ **Informatik, Mathematik und der Umgang mit Computern** machen dir Spaß und du hast gute Englischkenntnisse.\n ❤️Du arbeitest **sorgfältig**, bist **zuverläs**sig und möchtest Teil eines **starken Teams** werden.\n\nDu kannst alle Punkte abhaken?✅Dann passt du perfekt zu uns! Mit dem richtigen **Engagement** kannst du deine Ausbildung sogar**&#160;verkürzen** und richtig durchstarten.✈️\n\n**Das bieten wir**\n\n- Es geht am **1. August 2027** los\n- Du bekommst folgendes Bruttogehalt:\n**1. Lehrjahr: 1.353 Euro**\n**2. Lehrjahr: 1.401 Euro**\n**3. Lehrjahr: 1.533 Euro**\n- Du bekommst ein umfangreiches **Einführungsprogramm**, das dich optimal auf deine Ausbildung bei ROSEN vorbereitet\n- **Wir bezahlen deine Schulbücher**\n- Du profitierst von vergünstigten Mitgliedschaften im Fitnessstudio und anderen Sportvereinen (über Egym Wellpass)\n- Dich erwarten eine super **Azubifahrt&#160;**und Team-Events\n- Du arbeitest in einem **internationalen Unternehmen&#160;**mit modernen Arbeitsplätzen\n- Du bekommst monatlich attraktive Mitarbeiterrabatte auf viele Produkte über unser Corporate-Benefits-Programm\n- Wir bilden für den Eigenbedarf aus! Du hast gute Chancen, nach der Ausbildung übernommen zu werden und dich weiterzuentwickeln\n\n**Das sind wir**\n\nDie ROSEN Gruppe ist ein weltweit führender Anbieter von innovativen Lösungen in allen Bereichen der Integritätsprozesskette. Seit den Anfängen als Ein-Mann-Betrieb im Jahr 1981 ist ROSEN rasant gewachsen und ist heute eine in mehr als 110 Ländern operierende Technologiegruppe mit über 4.000 hochqualifizierten MitarbeiterInnen.\n\nDer Leistungsumfang der ROSEN Gruppe:\n\n- Inspektionen von industriellen Anlagen, um den sicheren und verlässlichen Betrieb nach den höchsten Standards zu gewährleisten\n- Individuelles Engineering, das effizientes Anlagen-Integritätsmanagement ermöglicht\n- Produktion und Vertrieb mit neuartigen Produkten und Systemen\n- Marktorientierte, aktuelle Forschung und Entwicklung nach dem neuesten Stand der Technik, die Produkte und Dienstleistungen mit \"Mehrwert\" bietet\n\nMehr Informationen zur ROSEN Gruppe unter [www.rosen-group.com](http://www.rosen-group.com/).", "gaji": "", "persyaratan": "**Das bringst Du mit**\nMittlere Reife / Realschulabschluss", "jenis_ausbildung": "Ausbildung | Fachinformatiker/in - Anwendungsentwicklung", "deskripsi_perusahaan": "ROSEN Mitarbeiterinnen und Mitarbeiter besitzen die Leidenschaft für Technologien und Innovationen. Unser Claim „empowered by technology“ ist der Schlüssel zu unseren herausragenden und einzigartigen Produkten und Dienstleistungen, sowohl in der Öl und Gas - als auch in verschiedensten anderen Industrien. Im Fokus unserer Forschung und unserer Lösungen steht der sichere Betrieb von industriellen Anlagen – zum Schutz von Mensch und Umwelt.", "apa_yang_ditawarkan": "**Das bieten wir**", "link_website_perusahaan": "http://www.arbeitsagentur.de", "alamat_email_bewerbung": "", "link_bewerbung": "", "kontak_penanggung_jawab": "", "dokumen_yang_harus_dipenuhi": "", "ba_job_url": "https://www.arbeitsagentur.de/jobsuche/jobdetail/10000-1206518499-S", "scraped_at": "2026-06-11T08:06:49.597068+00:00"}, {"referenznummer": "10000-1206368097-S", "category_id": "fachinformatiker_ae", "nama_perusahaan": "Entergon GmbH & Co. KG", "titik_data_di_peta": "50.253372,8.6376015", "posisi_kota": "Friedrichsdorf, Taunus", "alamat_detail": "Wilhelmstr. 14a, 61381 Friedrichsdorf, Taunus", "detail_deskripsi": "Wenn Du vom ersten Tag mitentwickeln willst, dann jetzt bewirb dich jetzt für eine Ausbildung als!\n\n# FACHINFORMATIKER/IN ANWENDUNGSENTWICKLUNG (M/W/D)\n\n## für die Entwicklung innovativer Softwarelösungen auf Basis unserer Cross-App-Plattform zum 1.08.2026\n\n###  WAS DICH AUSZEICHNET\n\n- Spaß am Programmieren und an der neuesten Informationstechnik\n- Vorkenntnisse in der Programmierung, gerne auch schon im Umgang mit HTML, CSS, Javascript, PHP und SQL\n- Gutes Zahlenverständnis und logisches Denkvermögen\n- Teamgeist und Spaß an projektbezogener Arbeit\n- Ambition über den technologischen Tellerrand hinauszublicken\n- Strukturierte und zielorientierte Arbeitsweise\n- Sehr gute Deutsch- und gute Englischkenntnisse in Wort und Schrift erforderlich\n\n### DEINE AUFGABEN\n\n- Weiterentwicklung und technische Betreuung von bestehenden Softwarelösungen im Bereich Mobile Lead Generation und Lead Management\n- Design und Implementierung von anspruchsvollen Datenmodellen und nachhaltigem, testbarem Code\n- Unterstützung bei der Analyse bestehender Geschäftsprozesse\n- Selbstständige Erarbeitung von neuen Lösungsansätzen\n\n### WAS WIR DIR BIETEN\n\n- Option auf Verkürzung der Ausbildungszeit auf 2 Jahre bzw. 2,5 Jahre bei guter Zwischenprüfung\n- Flache Hierarchien und kurze Kommunikationswege\n- Junges und dynamisches Team, das an einem Strang zieht\n- Eine ausgewogene Work-Life-Balance: Du kannst deine Arbeitszeiten flexibel gestalten um Arbeit und Privatleben stets in Einklang zu bringen\n- Wir verlieren den Spaßfaktor nie aus den Augen, ganz nach dem Motto: Wir sind erfolgreich, darum haben wir Spaß; wer Spaß hat, der hat auch Erfolg!\n- Eine interessante Kundenliste aus namhaften Groß- und mittelständischen Unternehmen\n- entergon Corporate Benefit Programm (dauerhafte Preisnachlässe auf über 800 Markenanbieter)\n- Betriebliche Zusatzkrankenversicherung (Vorsorgeuntersuchungen, Zahnersatz)\n- Kostenfreie Getränke: Wasser, Softdrinks, Kaffee und Tee\n\n### ÜBER ENTERGON\n\nentergon ist der führende Cloud- und Full-Service-Anbieter für Digital Signage-, Mobile App- und Web-Lösungen. Unser Ziel ist die Schaffung eines maximalen Kundenerlebnisses am initialen Point of Contact und entlang der Customer Journey. Wir lieben unsere Kunden. Wir sind schnell, flexibel und pragmatisch. Wir suchen gemeinsam mit unseren Kunden die beste Lösung. Die cloud-basierte entergon-Suite unterstützt unsere Kunden bei ihrer persönlichen Kommunikation und digitalen Lead Generierung am Point-of-Contact, auf Messen und Events, in Hotels, Schulungszentren, im Einzelhandel und natürlich im Außendienst.\n\nDu willst bei uns durchstarten? Dann sende uns bitte Deine vollständigen Bewerbungsunterlagen an [karriere@entergon.de](mailto:karriere@entergon.de)\n\n### ENTER! GO! ON!", "gaji": "", "persyaratan": "", "jenis_ausbildung": "Ausbildung | Fachinformatiker/in - Anwendungsentwicklung", "deskripsi_perusahaan": "Wenn Du vom ersten Tag mitentwickeln willst, dann jetzt bewirb dich jetzt für eine Ausbildung als!", "apa_yang_ditawarkan": "", "link_website_perusahaan": "http://www.arbeitsagentur.de", "alamat_email_bewerbung": "karriere@entergon.de", "link_bewerbung": "", "kontak_penanggung_jawab": "", "dokumen_yang_harus_dipenuhi": "Du willst bei uns durchstarten? Dann sende uns bitte Deine vollständigen Bewerbungsunterlagen an [karriere@entergon.de](mailto:karriere@entergon.de)", "ba_job_url": "https://www.arbeitsagentur.de/jobsuche/jobdetail/10000-1206368097-S", "scraped_at": "2026-06-11T08:06:49.907125+00:00"}, {"referenznummer": "10001-1003030981-S", "category_id": "fachinformatiker_ae", "nama_perusahaan": "Atruvia AG", "titik_data_di_peta": "51.931665,7.589709", "posisi_kota": "Münster, Westfalen", "alamat_detail": "GAD-Str. 2-6, 48163 Münster, Westfalen", "detail_deskripsi": "**Starte deine Karriere bei Atruvia: Ausbildung zum Fachinformatiker (m/w/d) – Fachrichtung Anwendungsentwicklung am Standort Münster**\n\nDu möchtest in die Welt der Softwareentwicklung einsteigen und von Anfang an praktisch mitarbeiten? In der Ausbildung zum Fachinformatiker (m/w/d) für Anwendungsentwicklung bei Atruvia kombinierst du fundiertes IT-Know-how mit abwechslungsreichen Aufgaben in der Banken-IT und legst den Grundstein für deine berufliche Zukunft.\n\n**Deine Aufgaben:**\n\n- **Programmiersprachen und Tools kennenlernen:** Schritt für Schritt baust du dir ein solides Fundament in modernen Programmiersprachen, Frameworks und Entwicklungsumgebungen auf.\n- **Mitarbeit an Bankensoftware:** Du unterstützt bei der Neu- und Weiterentwicklung von Anwendungen für die Finanzbranche und hilfst, bestehende Systeme zu verbessern.\n- **Konzepte erstellen und umsetzen:** Gemeinsam mit deinem Team wirkst du an fachlichen und technischen Konzepten mit und setzt diese in konkrete Softwarelösungen um.\n- **Weboberflächen gestalten:** Du beteiligst dich am Design und an der Entwicklung benutzerfreundlicher Weboberflächen.\n- **Testen und Dokumentieren:** Durch Tests, Fehleranalyse und Dokumentation trägst du dazu bei, dass unsere Anwendungen stabil, sicher und gut nachvollziehbar sind.\n\n**Deine Ausbildung:**\n\nIn rund drei Jahren entwickeln wir dich zum Profi in der Anwendungsentwicklung.\n\n- **Praxisnahe Ausbildung:** Du arbeitest von Beginn an in realen Projekten mit und sammelst praktische Erfahrung in verschiedenen Bereichen der Softwareentwicklung.\n- **Fokus auf KI und moderne Technologien:** Du lernst, wie du KI-Tools sinnvoll im Arbeitsalltag nutzt, Daten einordnest und eigene Ideen mit aktuellen Technologien umsetzt – ein Pluspunkt für deine weitere Laufbahn.\n- **Einführungswochen:** Zu Ausbildungsstart nimmst du an Kennenlern- und Teamtagen teil und erhältst einen Überblick über Atruvia, deinen Standort und deine Ansprechpartner:innen.\n- **Einsatz im Tagesgeschäft:** Du lernst unterschiedliche Abteilungen und Projekte kennen und siehst, wie vielfältig die Aufgaben in der Banken-IT sind.\n- **Seminare & Schulungen:** Ergänzend zur Berufsschule besuchst du Seminare, z. B. zu Java, Datenbanken und methodischer Softwareentwicklung.\n- **Veranstaltungen & Vernetzung:** Du hast die Möglichkeit, an Hackathons und fachlichen Events teilzunehmen und dich mit anderen Auszubildenden sowie Kolleg:innen zu vernetzen.\n- **Übernahme im Fokus:** Unser Ziel ist deine unbefristete Übernahme nach erfolgreichem Abschluss der Ausbildung – wir bilden für den eigenen Bedarf aus.\n\n**Was uns ausmacht:**\n\n- **Neue Perspektiven:** Bei Atruvia lernst du von erfahrenen Expert:innen der Banken-IT und wirst selbst Schritt für Schritt Teil dieser Community.\n- **Qualitativ hochwertige Ausbildung:** Unsere Ausbildung ist auf einem hohen Niveau ausgerichtet und wurde bereits mehrfach ausgezeichnet.\n- **Weiterbildungs- und Entwicklungsmöglichkeiten:** Auch nach der Ausbildung kannst du dich bei uns fachlich und persönlich weiterentwickeln.\n- **Feedback- und Lernkultur:** Regelmäßige Rückmeldungen helfen dir, dich kontinuierlich zu verbes d Hardcoverfertigung sowie der Versand.\n\n**Folgende Aufgaben warten auf dich**\n\n- Du entwickelst betriebsinterne oder kundenorientierte Software-Lösungen.\n- Du planst, entwickelst und erweiterst Programme.\n- Du entwickelst anwendungsgerechte Bedieneroberflächen.\n- Du analysierst und behebst Fehler in bestehenden Anwendungen.\n- Du lernst Entwicklungsprozesse und deren Umsetzung kennen.\n- Du setzt moderne Entwicklungsmethoden ein.\n- Du wendest unterschiedliche Programmiersprachen an.\n- Du bekommst individuelle Weiterbildungsmöglichkeiten.\n- Du arbeitest in einem jungen und engagierten Team.\n\n**Erkennst du dich wieder?**\n\n- Du verfügst mindestens über einen guten Abschluss der Mittleren Reife.\n- Dich begeistern neue Technologien und Interesse an digitale Medien zeichnet dich aus.\n- Du hast Spaß am Experimentieren und bist kreativ.\n- Eine gute Auffassungsgabe sowie ein logisches und analytisches Denkvermögen zeichnen dich aus.\n- Du arbeitest gerne selbstständig und lernst gerne Neues und bist sehr engagiert.\n\n**Gründe, die für uns sprechen**\n\n- Überdurchschnittliche Ausbildungsvergütung\n- Urlaubsgeld und Jahresleistung\n- Vermögenswirksame Leistungen\n- Zeugnisprämie\n- Beteiligung an der betrieblichen Altersvorsorge\n- Verschiedene Fortbildungsmöglichkeiten\n- Bezuschussung der Fahrtkosten zur Berufsschule\n- Mitwirkung an verschiedenen Azubiprojekten\n- Firmenevents für Mitarbeiter", "gaji": "", "persyaratan": "- Du verfügst mindestens über einen guten Abschluss der Mittleren Reife.\n- Dich begeistern neue Technologien und Interesse an digitale Medien zeichnet dich aus.\n- Du hast Spaß am Experimentieren und bist kreativ.\n- Eine gute Auffassungsgabe sowie ein logisches und analytisches Denkvermögen zeichnen dich aus.\n- Du arbeitest gerne selbstständig und lernst gerne Neues und bist sehr engagiert.\nMittlere Reife / Realschulabschluss", "jenis_ausbildung": "Ausbildung | Fachinformatiker/in - Anwendungsentwicklung", "deskripsi_perusahaan": "* 1T08:07:22.699227+00:00"}, {"referenznummer": "10001-1001777624-S", "category_id": "fachinformatiker_ae_2026", "nama_perusahaan": "topsystem GmbH", "titik_data_di_peta": "50.7918567,6.095302", "posisi_kota": "Aachen", "alamat_detail": "Krefelder Str. 201, 52070 Aachen", "detail_deskripsi": "### Vielfältige Aufgaben erwarten Dich:\n\nDu wirst Teil der topsystem GmbH und damit Teil der EPG. In der Ausbildung zum Fachinformatiker (w/m/d) mit Schwerpunkt Anwendungsentwicklung lernst Du die digitale und smarte Logistik von morgen kennen. Und natürlich wirst Du diese als vollwertiges Team-Mitglied auch aktiv mitgestalten! Zusammen mit uns wirst Du in die Welt der Anwendungsentwicklung und der Software-Tests eintauchen. Du erlernst die Grundlagen der Programmierung und findest Lösungen für Anwendungs- und Systemprobleme.\n\nDeine Ausbildung findet in einem dynamischen, innovativen und internationalen Umfeld statt. Du hast eigene Ideen? Setz sie um! Du bekommst neustes IT-Equipment und darfst Deinen Laptop natürlich auch in der Berufsschule nutzen. Sport machst Du entweder entspannt am Kickertisch oder mit Vollgas im WOF (zu einem stark vergünstigten Preis!). Dein Ausbilder und die Azubis aus höheren Ausbildungsjahren unterstützen Dich gerne bei aufkommenden Fragen und neuen Themenstellungen und es gibt noch einiges mehr für Dich! Aber am wichtigsten: Wir bilden Dich aus, weil wir Dich übernehmen wollen. Und “danach” bauen wir weiter auf eine starke Personalentwicklung, um Dein Potenzial gemeinsam mit Dir zu entdecken und zu nutzen. Klingt gut? Dann schick’ heute noch Deine Bewerbung los – dann lernen wir uns vielleicht schon sehr bald kennen! Übrigens: Die Ausbildung startet bei uns zum 01.08.2026.\n\n### Im Detail bieten wir Dir Folgendes:\n\n- Gemeinsam mit Deinem Team arbeitest Du an weltweiten Kundenprojekten im Bereich der Einzelhandel-, Automobil- und Flughafenlogistik.\n- Du findest die besten Lösungen für Anwendungs- und Systemprobleme.\n- Auch an der Entwicklung von internen Arbeitstools bist Du beteiligt.\n- Unterstützt durch dein Team erlernst Du die Grundlagen der Programmierung und der Programmiermethodik.\n- Du konzipierst und realisierst kundenspezifisch Softwareanwendungen, testest diese und passt neue und bereits bestehende Anwendungen an.\n- Du unterstützt uns bei der Verwaltung interner Anwendungen und Server-Umgebungen.\n- Du baust Dir Wissen hinsichtlich unterschiedlicher Einsatzkontexte unserer Lösungen bei Kunden auf.\n- Zusätzlich machen wir Dich fit für die IHK-Prüfungen und bereiten Dich umfangreich vor.\n\n###  Für einen guten Start bei topsystem bringst Du Folgendes mit: \n\n- Du hast Dein (Fach-)Abitur bereits in der Tasche oder wirst in naher Zukunft so weit sein.\n- Alternativ hast Du ein Studium begonnen und gemerkt, dass eine praktische Ausbildung Dir wesentlich mehr liegt.\n- Du bringst Leidenschaft und Neugier für das Thema IT sowie ein gutes technisches Grundverständnis mit.\n- Du weißt, wie wichtig zielorientiertes Lernen und Arbeiten ist - und vor allem willst Du das gleiche wie wir: Dinge nach vorne bringen und mit voller Energie an der Logistik der Zukunft arbeiten (übrigens ein Themenfeld, das nicht nur zukunftssicher ist, sondern z. B. auch Dich bereits heute schon täglich begleitet)!\n- Dein Profil rundest Du mit guten Deutsch- und Englischkenntnissen ab.\n\n[Ausbildung - Fachinformatiker (m/w/d) Anwendungsentwicklung | Ehrhardt + Partner Group (EPG) | 82](https://jobs-ads.epg.com/jobposting/14615985e88d091069bea787b18e3cf3a73d85320)", "gaji": "", "persyaratan": "- Du bringst Leidenschaft und Neugier für das Thema IT sowie ein gutes technisches Grundverständnis mit.\n- Du weißt, wie wichtig zielorientiertes Lernen und Arbeiten ist - und vor allem willst Du das gleiche wie wir: Dinge nach vorne bringen und mit voller Energie an der Logistik der Zukunft arbeiten (übrigens ein Themenfeld, das nicht nur zukunftssicher ist, sondern z. B. auch Dich bereits heute schon täglich begleitet)!\n- Dein P , Fertigteile für Gebäude und massive Fertighäuser sowie High-Tech-Leichtzuschläge. Wir gestalten die Branche aktiv mit und sind von der langfristigen Vision getrieben, ressourcenschonende Lösungen zu entwickeln und umzusetzen. Denken Sie mit uns neu, treiben Sie Ihre Ideen voran und bauen Sie mit uns die Zukunft!", "apa_yang_ditawarkan": "Wir bieten ab **01.09.2026** Ausbildungsplätze an für eine Ausbildung zum/r **Fachinformatiker/in** Fachrichtung Anwendungsentwicklung (m/w/d).", "link_website_perusahaan": "http://www.arbeitsagentur.de", "alamat_email_bewerbung": "ausbildung@dennert.de", "link_bewerbung": "", "kontak_penanggung_jawab": "Bei Fragen kannst Du uns gerne eine E-Mail an ausbildung@dennert.de schreiben oder uns unter der 09552 71-223 anrufen.", "dokumen_yang_harus_dipenuhi": "", "ba_job_url": "https://www.arbeitsagentur.de/jobsuche/jobdetail/10000-1203507855-S", "scraped_at": "2026-06-11T08:07:28.423877+00:00"}, {"referenznummer": "10000-1206789922-S", "category_id": "fachinformatiker_ae_2026", "nama_perusahaan": "Landesdirektion Sachsen Dienststelle Leipzig", "titik_data_di_peta": "51.0665003,13.7726773", "posisi_kota": "Dresden", "alamat_detail": "Dresden", "detail_deskripsi": "STELLENAUSSCHREIBUNG\n\n**(Kennziffer: Azubi-FI-2027)**\n\nAn der Dienststelle **Chemnitz (vorzugsweise, auch in Dresden oder Leipzig möglich)** der Landesdirektion Sachsen ist **zum 1. August 2027&#32;**ein Ausbildungsplatz für die Ausbildung\n\nzum **Fachinformatiker/ zur Fachinformatikerin (m/w/d) in der Fachrichtung Anwendungsentwicklung**\n\nzu besetzen.\n\nSie suchen eine abwechslungsreiche und praxisnahe Ausbildung mit lang-fristiger Perspektive? Sie interessieren sich für moderne Informationstech-nologien, Softwareentwicklung und digitale Verwaltungsprozesse? Sie möchten Verantwortung übernehmen, innovative IT-Lösungen entwickeln und die digitale Zukunft des Freistaates Sachsen aktiv mitgestalten? Dann starten Sie mit uns in eine vielseitige und sichere berufliche Zukunft im öffentlichen Dienst.\n\n**Ihre Ausbildung bei der Landesdirektion Sachsen**\n\nFachinformatiker in der Fachrichtung Anwendungsentwicklung entwickeln, testen und betreuen Softwarelösungen für die öffentliche Verwaltung. Sie leisten einen wichtigen Beitrag zur Digitalisierung von Verwaltungsprozessen und unterstützen die Fachbereiche durch moderne IT-Anwendungen.\n\nZu den Tätigkeiten gehören unter anderem:\n\n ▪ Entwicklung und Anpassung von Softwareanwendungen\n ▪ Analyse fachlicher Anforderungen und Erarbeitung technischer Lösungskonzepte\n ▪ Programmierung und Weiterentwicklung bestehender Anwendungen\n ▪ Planung, Durchführung und Dokumentation von Softwareprojekten\n ▪ Durchführung von Softwaretests sowie Fehleranalyse und Fehlerbehebung\n ▪ Betreuung und Optimierung bestehender IT-Verfahren\n ▪ Mitarbeit bei der Digitalisierung von Verwaltungsprozessen\n\nDie dreijährige duale Ausbildung verbindet theoretische Lerninhalte mit praxisnahen Ausbildungsabschnitten innerhalb der Landesdirektion Sachsen. Durch den regelmäßigen Wechsel zwischen Theorie und Praxis können die erworbenen Kenntnisse unmittelbar angewendet und vertieft werden.\n\nAls Mittelbehörde zwischen der Sächsischen Staatsregierung und den Kommunen übernimmt die Landesdirektion Sachsen zahlreiche an-spruchsvolle Aufgaben. Unsere Auszubildenden erhalten dabei spannende Einblicke in unterschiedlichste Fachbereiche und wirken an der Entwicklung digitaler Lösungen für vielfältige Verwaltungsaufgaben mit.\n\nSo erwerben Sie nicht nur fundierte Kenntnisse in der Softwareentwicklung und Informationstechnik, sondern sammeln zugleich wertvolle praktische Erfahrungen für Ihren erfolgreichen Berufseinstieg.\n\n**Das bringen Sie mit**\n\nVoraussetzung für die Teilnahme am Auswahlverfahren sind:\n\n ▪ ein erfolgreicher Realschulabschluss bis zum Ausbildungsbeginn,\n ▪ gute Leistungen insbesondere in den Fächern Informatik, Mathematik, Deutsch und Englisch,\n ▪ Interesse an Informationstechnologie, Softwareentwicklung und digitalen Zusammenhängen,\n ▪ analytisches Denkvermögen sowie eine strukturierte Arbeitsweise,\n ▪ Teamfähigkeit, Kommunikationsstärke und Zuverlässigkeit,\n ▪ eine hohe Lern- und Leistungsbereitschaft.\n\nVon Vorteil sind außerdem:\n\n ▪ erste Erfahrungen im Bereich Programmierung oder Softwareentwicklung,\n ▪ absolvierte Schülerpraktika im IT-Bereich,\n ▪ gute Kenntnisse im Umgang mit gängiger Hard- und Software,\n ▪ Interesse an aktuellen technologischen Entwicklungen.\n\n**Ablauf der Ausbildung**\n\nWährend Ihrer Ausbildung werden Sie durch erfahrene Ausbilder sowie IT-Fachkräfte begleitet und unterstützt. Die praktische Ausbildung findet überwiegend in den IT-Bereichen der Landesdirektion Sachsen statt. Dort lernen Sie unterschiedliche Aufgabenfelder kennen und arbeiten frühzeitig an Projekten mit. Die theoretische Ausbildung erfolgt am beruflichen Schulzentrum für Technik I, Industrieschule Chemnitz. Ergänzend werden durch den Ausbildungsverbund für Fachinformatiker in der sächsischen Landesverwaltung weitere fachliche Kompetenzen durch berufspraktische Unterweisungen und fachtheoretische Lehrgänge vermittelt.\n\nDie abgeschlossene Berufsausbildung qualifiziert Sie für Tätigkeiten im Bereich der Softwareentwicklung und Anwendungsbetreuung innerhalb der öffentlichen Verwaltung.\n\nFür das Ausbildungsverhältnis gelten die Bestimmungen des Tarifvertrages für Auszubildende der Länder (TVA-L BBiG).\n\n**Vergütung und Leistungen**\n\nDie Ausbildungsvergütung beträgt derzeit monatlich:\n\n ▪ im 1. Ausbildungsjahr: 1.236,82 Euro\n ▪ im 2. Ausbildungsjahr: 1.290,96 Euro\n ▪ im 3. Ausbildungsjahr: 1.340,61 Euro\n\nDarüber hinaus erhalten Sie:\n\n ▪ Jahressonderzahlungen,\n ▪ gegebenenfalls vermögenswirksame Leistungen in Höhe von 6,65 Euro monatlich,\n ▪ eine Abschlussprämie in Höhe von 400,00 Euro bei erfolgreichem Bestehen der Abschlussprüfung,\n ▪ 30 Tage Urlaub pro Kalenderjahr,\n ▪ eine qualifizierte Betreuung während der gesamten Ausbildungszeit,\n ▪ gute Perspektiven für eine anschließende Beschäftigung im öffentlichen Dienst.\n\n**Bewerbung und Auswahlverfahren**\n\nHaben wir Ihr Interesse geweckt? Dann freuen wir uns auf Ihre Bewerbung.\n\nBitte senden Sie folgende Unterlagen:\n\n ▪ Anschreiben\n ▪ tabellarischer Lebenslauf\n ▪ Kopie des letzten Schulzeugnisses\n ▪ gegebenenfalls Praktikumszeugnisse\n\nunter Angabe der Kennziffer**&#32;Azubi-FI-2027** ausschließlich im PDF-Format per E-Mail an:\n**bewerbungausbildung@lds.sachsen.de**.\n\nBewerbungsschluss für den Ausbildungsbeginn am 1. August 2027 ist der 25. Oktober 2026. Das Auswahlverfahren besteht aus einem elektronischen Eignungstest sowie einem anschließenden Auswahlgespräch. Die erfolgreiche Teilnahme am Eignungstest ist Voraussetzung für die Einladung zum Auswahlgespräch.\n\nWeiterführende Informationen zur Ausbildung finden Sie auf den entsprechenden Informationsseiten der Landesdirektion Sachsen.\n\n**Kontakt**\n\nFür Fragen steht Ihnen gern zur Verfügung:\n\nFrau Relius\nTelefon: 0341 / 977 1333\nE-Mail: ausbildung@lds.sachsen.de\n\n**Wir sind bestrebt, schwerbehinderte Menschen oder ihnen Gleichgestellte besonders zu fördern, achten im Bewerbungsverfahren bei gleicher Eignung auf ihre bevorzugte Berücksichtigung und bitten daher um entsprechende Hinweise in Ihrer Bewerbung.**\n\n**Bewerber nach dem Soldatenversorgungsgesetz (SVG) weisen wir an dieser Stelle auf die Anforderungen der Vormerkstelle des Freistaates Sachsen (www.lds.sachsen.de/soziales) hin.**\n\nSoweit Sie die vorgenannten Voraussetzungen erfüllen, bitten wir Sie um Zusendung Ihrer Bewerbung unter der **Kennziffer: Azub-FI-2027**\n\nper E-Mail an\n**bewerbungausbildung@lds.sachsen.de**\n\n**Es können nur Anhänge im pdf-Format bearbeitet werden.**\n\n**Bewerbungsschluss für den Ausbildungsbeginn am 1. August 2027 ist am 25. Oktober 2026.**\n\nAls Ansprechpartner steht Ihnen Frau Relius, Telefon 0341 977-1333, zur Verfügung.\n\n\\*Informationen zum Zugang für verschlüsselte / signierte E-Mails / elektronische Dokumente sowie elektronische Zugangswege finden Sie unter : www.lds.sachsen.de/kontakt\n\nIhre Daten werden von der Landesdirektion Sachsen in Erfüllung ihrer Aufgaben gemäß den geltenden Bestimmungen zm Datenschutz verarbeitet. Weitere Informationen über die Verarbeitung der Daten und Ihre Rechte bei der Verarbeitung der Daten finden Sie unter dem Link www.lds.sachsen.de/datenschutz sowie in den dort eingestellten Informationsblättern.", "gaji": "Jahr 1: 1237 EUR/Monat | Jahr 2: 1291 EUR/Monat | Jahr 3: 1341 EUR/Monat", "persyaratan": "▪ Analyse fachlicher Anforderungen und Erarbeitung technischer Lösungskonzepte\n▪ Programmierung und Weiterentwicklung bestehender Anwendungen\n▪ Planung, Durchführung und Dokumentation von Softwareprojekten\n▪ Durchführung von Softwaretests sowie Fehleranalyse und Fehlerbehebung\n▪ Betreuung und Optimierung bestehender IT-Verfahren\n▪ Mitarbeit bei der Digitalisierung von Verwaltungsprozessen\nMittlere Reife / Realschulabschluss", "jenis_ausbildung": "Ausbildung | Fachinformatiker/in - Anwendungsentwicklung", "deskripsi_perusahaan": "STELLENAUSSCHREIBUNG", "apa_yang_ditawarkan": "**Vergütung und Leistungen**", "link_website_perusahaan": "http://www.arbeitsagentur.de", "alamat_email_bewerbung": "bewerbungausbildung@lds.sachsen.de", "link_bewerbung": "", "kontak_penanggung_jawab": "**Kontakt**", "dokumen_yang_harus_dipenuhi": "Bitte senden Sie folgende Unterlagen:", "ba_job_url": "https://www.arbeitsagentur.de/jobsuche/jobdetail/10000-1206789922-S", "scraped_at": "2026-06-11T08:07:28.727067+00:00"}, {"referenznummer": "10001-1002927036-S", "category_id": "fachinformatiker_ae_2026", "nama_perusahaan": "meap GmbH", "titik_data_di_peta": "51.4473886,7.3760302", "posisi_kota": "Witten", "alamat_detail": "Annenstr. 172, 58453 Witten", "detail_deskripsi": "Zur Unterstützung unseres Teams suchen wir ab August 2026 einen\n\nAuszubildenden zum Fachinformatiker Anwendungsentwicklung\\*\n\nDu hast bereits Programmiererfahrung gesammelt, ob im Studium oder selbst beigebracht und willst jetzt praxisnah durchstarten? Dann bist Du bei uns goldrichtig. In Deiner Ausbildung zum Fachinformatiker für Anwendungsentwicklung bringst Du Dein Know-how in echte Projekte ein und lernst, Software zu planen, zu entwickeln und zu verbessern. Kein Hörsaal, kein Blabla. Hier zählt, was Du wirklich kannst. Bei uns wirst Du Teil eines Teams, das täglich mit Kreativität, Logik und einem Hauch von Nerdkultur echte Lösungen baut.\n\n## Worin Deine Aufgaben bestehen\n\n**Entwicklung & Programmierung**\n\n- **Coding**:  Du lernst webbasierte Programmiersprachen, HTML und CSS sowie Konzepte zur Softwareentwicklung (Software-Architektur & Design Patterns) kennen.\n- **Testing**:  Du überprüfst Software auf Fehler, testest neue Features und sorgst dafür, dass Anwendungen stabil und performant laufen.\n- **Dokumentation**: Du erstellst Tutorials, Anwenderhandbücher und technische Dokumentationen für unsere Softwarelösungen und Produkte.\n\n**Systeme & Datenbanken**\n\n- **Datenbanken**: Du arbeitest mit SQL-Dialekten (MariaDB, postgreSQL & MySQL) und lernst den Aufbau relationaler Datenbankstrukturen.\n- **Integration**: Du verbindest Anwendungen mit Backend-Systemen und Schnittstellen.\n\n**Teamwork**\n\n- **Zusammenarbeit**: Du arbeitest eng mit anderen Entwicklern, Systemadministratoren und Kollegen aus anderen Fachabteilungen zusammen.\n\n**Praxisprojekte**\n\n- **Projektmitarbeit**: Du steigst früh in reale Kundenprojekten ein und kannst eigene Ideen einfließen lassen.\n- **Kundenkontakt**: Du unterstützt dabei, Kundenwünsche zu erfassen, Lösungen vorzustellen und Anwender im Umgang mit Standard- oder Individualsoftware zu schulen.\n\n## SO GEHT ES NACH DER AUSBILDUNG WEITER\n\nNach Übernahme findest Du als Fachinformatiker\\* für Systemintegration in unserer IT vielfältige Einsatzmöglichkeiten. Bei uns bist Du ein Allrounder, Du arbeitest in den Bereichen Support, Hard- und Softwareauswahl, Netzwerke, Server/Rechenzentrum oder IT-Security. Wie die IT entwickelt sich auch Dein Arbeitsumfeld ständig weiter – daher sind regelmäßige Schulungen und Weiterbildungen unerlässlich. Und unser IT-Umfeld bietet Dir vielfältige Möglichkeiten, Dich zu dem Experten\\* zu entwickeln, der Du sein willst!\n\nDas heißt, dass Du auch nach der Ausbildung immer weiter lernst und Dein umfangreiches Wissen stetig erweiterst und aktualisierst.\n\n## DAS SOLLTEST DU MITBRINGEN\n\n**Bildungsweg & Voraussetzungen**\n\n*(OR-Verknüpfung)*\n\n- **Studium**: Du hast ein Studium im Bereich der Informatik abgeschlossen oder begonnen und gemerkt, dass Dir die praktische Umsetzung mehr liegt.\n- **Ausbildung**: Du bringst Wissen aus einer anderen IT-nahen Ausbildung mit und möchtest Dich auf die Konzeption von Software fokussieren.\n- **Selbsterlernt**: Du hast Dir das Vorwissen selbst beigebracht und willst jetzt praxisnah und professionell einsteigen.\n\n**Persönlichkeit & Haltung**\n*(AND-Verknüpfung)*\n\n- **Lernfreude**: Du willst Neues entdecken, an Dir arbeiten und jeden Tag ein Stück besser werden.\n- **Teamgeist**: Du arbeitest gern mit anderen zusammen, tauschst Dich aus und bringst Ideen aktiv ein.\n- **Eigeninitiative**: Du übernimmst Verantwortung, gehst Probleme an und suchst nach smarten Lösungen.\n\n**Bonus-Skills**\n\n- **Erfahrungen**: Du hast Dich bereits mit webbasierter Programmierung (z. B. PHP) beschäftigt.\n- **Projekte**: Du hast schon eigene Projekte umgesetzt oder an Software mitgearbeitet? Dann schick uns gerne einen Link oder Beispiele.\n\nDu hast Lust, professionellen Code zu schreiben, statt nur drüber zu reden? Dann starte Deine Entwicklerstory bei uns und zeig, was in Deinem Code steckt! Bewirb Dich jetzt!\n\n## AUSBILDUNGSDAUER\n\nDeine Ausbildung bei uns beträgt 3 Jahre. Du bist ein Überflieger und kannst uns bereits bei der Bewerbung mit entsprechenden Vorkenntnissen, sehr guten Noten und Leistungen oder bereits abgeschlossenen Berufsausbildungen überzeugen? Dann können wir Deine Ausbildungsdauer gerne bis zu 6 Monate verkürzen.\n\n## DAS WIRST DU VERDIENEN\n\nDie Vergütung während der Ausbildungszeit ist bei uns klar definiert:\n\n- 1. Ausbildungsjahr: 1.250,00 € brutto\n- 2. Ausbildungsjahr: 1.300,00 € brutto\n- 3. Ausbildungsjahr: 1.350,00 € brutto\n\nAußerdem unterstützen wir Dich in folgenden Punkten:\n\n- Kostenübernahme Deines ÖPNV-Tickets\n- Kostenübernahme Deiner Lernmaterialien wie Fachbücher, E-Learning-Angebote oder Material zum Vorbereiten auf Deine Zwischen- oder Abschlussprüfung\n- Einräumen von freien Zeitslots zur Fertigstellung des Führerscheins\n- Deutlich erhöhte Überstundenvergütung bei entsprechender Leistung\n\nDas sind nur ein paar der Beispiele, die wir für unsere Auszubildenden ermöglicht haben. Weitere Unterstützungsmöglichkeiten sprechen wir gerne individuell mit Dir ab.\n\n## UND WIR BIETEN NOCH VIEL MEHR\n\n- Übernahme bei guten Leistungen\n- 31 + 1Tage Urlaub im Jahr fürs Meer, Schnee, die Berge oder auch für Balkonien\n- Wir stehen auf kurze Wege sowie für Kommunikation „auf Augenhöhe“, darum sind die Hierarchien entsprechend flach und das „Du“ hier selbstverständlich\n- Dir den Hintern plattsitzen findest Du langweilig? Dann steh doch auf! Bei uns hast Du nicht nur top-moderne Hard- und Software, sondern auch höhenverstellbare Tische und ergonomisch eingerichtete Arbeitsplätze!\n- Du willst Effizienz? Kannst Du haben! Wir arbeiten mit 3 Bildschirmen (Multimonitor-Betrieb)\n- Teamwork ist cool und Austausch ist wichtig – siehst Du auch so? Top! Und weil uns Teamwork so wichtig ist, haben wir auch 4 coole Firmenevents pro Jahr\n- Du bist ein Frühstücksmensch? Dann wird Dich unser tägliches Mitarbeiter-Frühstück zu Selbstkosten begeistern\n- Kaffeejunkie? Oder doch lieber Wasser, Tee oder Saft? Kannst Du alles haben – for free\n- Abteilungseigene, klimatisierte Büroräume statt Großraumbüro? Kriegste bei uns!\n- Attraktive Betriebliche Sozialleistungen (wie z.B. eine Betriebliche Altersvorsorge, Vermögenswirksame Leistung, persönliche Sachbezugskarte, etc.)\n- Du hast einen Hund, welchen Du immer gerne an Deiner Seite hast? Dann bring ihn doch gerne mit ins Office\n\n## SO BEWIRBST DU DICH BEI UNS\n\nSchick einfach Deine vollständigen Bewerbungsunterlagen in **einer** pdf-Datei über den Button  **„Jetzt bewerben“** zu. Dazu zählen bei uns ein Anschreiben (damit wir mehr über Deine Beweggründe, Interessen und ggfs. ersten Erfahrungen erfahren), ein Lebenslauf sowie Deine letzten Zeugnisse. Falls Du schon einmal erste Erfahrungen mit Servern oder Netzwerken gesammelt hast, egal ob es im Rahmen von eigenen erstellten Projekten war oder Du in einem Praktikum an einem Projekt mitgewirkt hast, freuen wir uns natürlich über einen Link oder Referenzen.\n\nDeine Ansprechpartner sind Katharina (Recruiterin) und Florian (Leitung IT).\n\nDu möchtest gerne vorab Fragen stellen? Dann kannst Du das unter 02302 17918-1210 tun oder schick uns Deine Fragen per Mail an: [jobs@meap.de](https://mailto:jobs@meap.de). Wir freuen uns schon auf Dich.\n\n• Bei meap akzeptieren wir Dich, wie Du bist.  Dein Geschlecht und wen Du liebst, Deine ethnische Herkunft, Religion, Alter und Behinderung spielen keine Rolle, denn bei uns zählst Du als Person, Punkt.", "gaji": "Jahr 1: 1250 EUR/Monat | Jahr 2: 1300 EUR/Monat | Jahr 3: 1350 EUR/Monat", "persyaratan": "**Bildungsweg & Voraussetzungen**\nFachhochschulreife", "jenis_ausbildung": "Ausbildung | Fachinformatiker/in - Systemintegration", "deskripsi_perusahaan": "Zur Unterstützung unseres Teams suchen wir ab August 2026 einen", "apa_yang_ditawarkan": "Nach Übernahme findest Du als Fachinformatiker\\* für Systemintegration in unserer IT vielfältige Einsatzmöglichkeiten. Bei uns bist Du ein Allrounder, Du arbeitest in den Bereichen Support, Hard- und Softwareauswahl, Netzwerke, Server/Rechenzentrum oder IT-Security. Wie die IT entwickelt sich auch Dein Arbeitsumfeld ständig weiter – daher sind regelmäßige Schulungen und Weiterbildungen une rt. Neben der Berufsschule werden regelmäßige hausinterne Fortbildungsveranstaltungen angeboten. Im späteren Fortschritt der Ausbildung werden die Auszubildenden schrittweise in Projekte und Projektteams integriert. Die Ausbildung endet mit einem anspruchsvollen Praxisprojekt und der Prüfung durch die IHK.\n\nBringst Du die richtigen Vorkenntnisse mit? Passt Du ins Team? Bitte informiere Dich vor deiner Bewerbung [über unsere Anforderungen](https://www.metalogie.de/karriere/anforderungen).", "gaji": "", "persyaratan": "Fachliche Grundlagen deiner Ausbildung sind der strukturierte Umgang mit Daten, das Modellieren und Bewerten von Prozessen sowie der Einsatz geeigneter Analyse‑ und IT‑Werkzeuge. Du lernst, technische und fachliche Anforderungen miteinander zu verbinden und Ergebnisse verständlich aufzubereiten. Wichtig sind uns Neugier, analytisches Denken und die Bereitschaft, Verantwortung zu übernehmen.\nFachhochschulreife", "jenis_ausbildung": "Ausbildung | Fachinformatiker/in - Daten- und Prozessanalyse", "deskripsi_perusahaan": "", "apa_yang_ditawarkan": "", "link_website_perusahaan": "http://www.arbeitsagentur.de", "alamat_email_bewerbung": "", "link_bewerbung": "", "kontak_penanggung_jawab": "", "dokumen_yang_harus_dipenuhi": "", "ba_job_url": "https://www.arbeitsagentur.de/jobsuche/jobdetail/10001-1003024370-S", "scraped_at": "2026-06-11T08:07:32.810683+00:00"}, {"referenznummer": "10001-1003185050-S", "category_id": "fachinformatiker_dpa", "nama_perusahaan": "Jupiter Software Consulting GmbH", "titik_data_di_peta": "52.239024,8.1616725", "posisi_kota": "Bissendorf, Kreis Osnabrück", "alamat_detail": "Zum Eistruper Feld 34, 49143 Bissendorf, Kreis Osnabrück", "detail_deskripsi": "## Aufgabenbereich\n\n## So könnte die To-Do-Liste aussehen - wir geben unseren Mitarbeiter:innen Freiraum was persönliche Fokussierung bestimmter Aufgaben und Tätigkeiten angeht, insbesondere um Stärken weiter auszubauen\n\n- Analyse und Optimierung von Geschäftsprozessen\n- Digitalisierung und Automatisierung von Abläufen\n- Datenbeschaffung und -aufbereitung für Prozesse\n- Dokumentation und Anwenderunterstützung\n- Entwicklung individueller IT-Lösungen\n\n## Was erwartet Dich während der Ausbildung?\n\nDer schulische Teil der Ausbildung findet tageweise an einer Berufsschule in Osnabrück statt. Hier lernst Du die theoretischen Grundlagen für die Arbeit als Fachinformatiker. An deinen Arbeitstagen bekommst du bereits deine ersten Projektaufgaben zugeteilt, bei denen Dich dein Mentor bei Fragen immer unterstützt.\n\n## Was erwartet dich auf dem Jupiter?\n\n## Wir bilden Dich aus, um Dich zu übernehmen.\n\nDeswegen bereiten wir Dich konsequent auf das Arbeitsleben vor, schulen Dich entsprechend und werden Dir nach und nach mehr Verantwortung übertragen. Dein Pate, welcher Dir während Deiner gesamten Ausbildungszeit zur Seite steht, wird Dich dabei unterstützen und Dir aufkommende Fragen beantworten. Wenn Du besondere Vorkenntnisse hast oder mit guten Leistungen glänzt, geben wir Dir gerne die Möglichkeit, Deine Ausbildung zu verkürzen.\n\n## Bewerberprofil\n\n## Folgende Qualifikationen wünschen wir uns von unseren Kandidaten\n\n- Du hast Dein (Fach-)Abitur in der Tasche oder verfügst über einen qualifizierten Realschulabschluss mit gutem bis sehr guten Notendurchschnitt\n- Zu Deinen Stärken gehört logisches Denken\n- Du bist sorgfältig und strukturiert\n- Du interessierst Dich für die IT, bestenfalls hast du schon erste Erfahrungen in der Informatik oder beim Entwickeln gemacht\n- Du besitzt einen Führerschein der Klasse B", "gaji": "", "persyaratan": "## Bewerberprofil\nMittlere Reife / Realschulabschluss", "jenis_ausbildung": "Ausbildung | Fachinformatiker/in - Daten- und Prozessanalyse", "deskripsi_perusahaan": "## Aufgabenbereich", "apa_yang_ditawarkan": "", "link_website_perusahaan": "http://www.arbeitsagentur.de", "alamat_email_bewerbung": "", "link_bewerbung": "", "kontak_penanggung_jawab": "Der schulische Teil der Ausbildung findet t r Verbesserung von Datenqualität.\n- Schon während deiner Ausbildung bist du direkt in das Tageschgeschäft eingebunden und unterstützt z. B. unsere Servicetechniker bei der Behebung von Anwenderproblemen.\n- In eigenen Projekten darfst du stetig neue Erfahrungen sammeln und Verantwortung übernehmen. \n\n## Was Du mitbringst\n\n- Ob abgeschlossene mittlere Reife, Abitur, oder auch erste Schritte in einem Studium. Dein bisheriger Weg ist erst einmal zweitrangig. Viel wichtiger ist uns, für was du brennst! \n- Du verfügst über ein Grundlegendes Verständnis für technische Sachverhalte. \n- Du hast Erfahrung im Programmieren und Interesse an Informationstechnik.\n- Des Weiteren verfügst du über gute Windows-Kenntnisse und bist sicher im Umgang mit den gängigen MS-Office-Programmen.\n- Zudem hast du Freude im Umgang mit KundInnen und KollegInnen und siehst dich selbst als serviceorientiert. Du kommunizierst sicher auf Deutsch und bist ein zuverlässiger Teamplayer. \n\n## **Dein Equipment**\n\nWir statten dich perfekt für deine Arbeit aus – modernste Technik, höhenverstellbare Schreibtische, Dual-Display Setup und für Dienstreisende ein iPhone und iPad.\n\n## **Dein Rhythmus**\n\nGestalte deinen Arbeitsalltag flexibel – unsere Gleitzeitregelung und unsere hybride Arbeitsweise machen es möglich.\n\n## **Deine Entwicklung**\n\nWir boosten deine Entwicklung – freue dich auf ein umfangreiches Weiterbildungsangebot mit zielgerichteten Entwicklungsmaßnahmen.\n\n## **Deine Teamevents und Firmenfeiern**\n\nWork hard, play hard – wir investieren in Teamevents und Firmenfeiern, um unseren Teamgeist zu stärken und unseren Zusammenhalt zu fördern, damit wir wieder unser Bestes für unsere Kunden geben können.\n\n## **Dein Ausgleich**\n\nMit klarem Kopf ins Wochenende – zeige freitags dein Können beim Tennisspielen. Egal ob Profi oder Anfänger. Bei uns steht der Spaß im Vordergrund.\n\n## **Deine Zukunft**\n\nBestens auf die Zukunft vorbereitet – unsere betriebliche Altersvorsorge macht , "posisi_kota": "Goslar", "alamat_detail": "Höhlenweg 12, 38642 Goslar", "detail_deskripsi": "Die EDV-Optik-Partner GmbH oder kurz OPA entwickelt Branchensoftware für Optiker und Akustiker.\n\nWenn du also mal eine Brille kaufst und deine persönlichen Daten an einem Tablet oder PC erfasst werden oder dein Optiker dir Rechnungen oder Werbung schickt, passiert das vermutlich mit OPA.\n\nUns gibt es seit über 40 Jahren. Somit haben wir uns unseren weisen Namen auch bald verdient. 2018 ging die Geschäftsführung in die nächste Generation und seit ein paar Jahren ist auch die nächste Generation unserer Software am Start und kommt richtig gut an.\n\nWas Du tust:\n\n- Von Beginn an wirst Du in das Tagesgeschäft einbezogen und hilfst uns bei der Pflege und Weiterentwicklung bestehender Programme.\n- Du lernst von unseren Entwicklern verschiedenste Arbeitsmethoden, Architekturen und Programmiersprachen.\n- Du analysierst mit unseren Kunden deren Arbeitsabläufe und richtest ihren OPA entsprechend ein.\n- Du berätst Optiker & Akustiker in der Bedienung von OPA.\n- Darüber hinaus bieten wir dir ein Rundum-Team-Play: Du hast die Möglichkeit, auch im Vertrieb und im Marketing zu lernen und mitzuwirken.\n\nWas wir an Dir besonders schätzen:\n\n- Freundlichkeit: Um unser tolles Arbeitsklima für unsere Kunden und vor allem für unsere Mitarbeiter zu halten, ist Freundlichkeit dein wichtigster Charakterzug!\n- Motivation: Nur wenn du etwas bewegen willst, wirst du dich in unserem Team wohl fühlen. Andersherum steht dir jeder im Team zur Seite, um dich zu unterstützen.\n- Analytisches Verständnis & Kommunikation: Um bei OPA glücklich zu werden, ist es wichtig, dass du die Gabe hast, schnell zu verstehen. Ebenso wichtig ist es, dass du dich selbst gut ausdrücken kanns und im richtigen Moment die richtigen Fragen stellst.\n\nWarum OPA:\n\n- Flexible Arbeitszeiten\n- Home-Office möglich\n- Du wirst an die Hand genommen aber lernst auch eigenverantwortlich zu arbeiten.\n- Du findest ein wirklich familiäres Team.\n- Absolut offene und direkte Kommunikation mit dem Geschäftsführer, der immer ein offenes Ohr hat\n- Teamevents (Lasertag, Kart-Fahren, Grillen, Videospielabende und was dir so einfällt)\n- Lass dich von den herzlichen Kollegen überzeugen!\n- ...und wir haben Hundewelpen :)\n\nDer Start der Ausbildung bei uns ist nicht an das Schuljahr gebunden und jederzeit möglich.\n\nWenn du also auch bald ein OPA werden willst, bewirb dich gerne direkt beim Geschäftsführer Jochen Hirschfelder per E-Mail.", "gaji": "", "persyaratan": "", "jenis_ausbildung": "Ausbildung | Fachinformatiker/in - Daten- und Prozessanalyse", "deskripsi_perusahaan": "Die EDV-Optik-Partner GmbH oder kurz OPA entwickelt Branchensoftware für Optiker und Akustiker.", "apa_yang_ditawarkan": "", "link_website_perusahaan": "http://www.arbeitsagentur.de", "alamat_email_bewerbung": "", "link_bewerbung": "", "kontak_penanggung_jawab": "", "dokumen_yang_harus_dipenuhi": "", "ba_job_url": "https://www.arbeitsagentur.de/jobsuche/jobdetail/10001-1003121982-S", "scraped_at": "2026-06-11T08:07:40.427139+00:00"}, {"referenznummer": "12444-1440514-2-S", "category_id": "fachinformatiker_dpa", "nama_perusahaan": "Deutsche Telekom AG", "titik_data_di_peta": "51.3534221,12.3675993", "posisi_kota": "Leipzig", "alamat_detail": "04105 Leipzig", "detail_deskripsi": "Stellen-ID: 289443_TA\n\nEinstiegsart: Ausbildung\nAusbildungsbeginn: 01.09.2026\nDauer: 3 Jahre\nVergütung: 1.287 bis 1.393 Euro\nStandort: Leipzig\n\nAufgabe\n\n\nIn unserer Ausbildung zum Fachinformatiker bzw. zur Fachinformatikerin der Fachrichtung Daten- und Prozessanalyse lernst du IT-Lösungen für digitale Produktions- und Geschäftsprozesse im Umfeld eines modernen Technologiekonzerns zu entwickeln.\n\nDiese Ausbildungsinhalte erwarten dich u.a.:\n\n- Analysieren von Arbeits- und Geschäftsprozessen\n- Analysieren von Datenquellen und Bereitstellen von Daten\n- Optimieren sowie Digitalisieren von Produktions- und Geschäftsprozessen\n- Beraten von Kundinnen und Kunden, etwa zu Fragen der IT-Sicherheit und des Datenschutzes\n\n\nDetailliertere Informationen über die gesamten Ausbildungsinhalte findest du hier [https://www.bibb.de/dienst/berufesuche/de/index_berufesuche.php/profile/apprenticeship/ujhz677].\n\nMögliche Einsatzbereiche während der Ausbildung können z.B. im Big Data-Umfeld sein, wo du kundenspezifische Softwarelösungen entwickelst.\nWenn du jetzt wissen willst, wie wir eine digitale Zukunft gestalten und woran wir arbeiten, dann schaue hier [https://www.telekom.com/de/karriere/woran-wir-arbeiten] in die Business Bereiche der Deutschen Telekom!\n\nNach dem Abschluss? Dir stehen viele Türen offen! Ob im Support Engineering oder Software Development – bei uns hast du beste Chancen, deine Karriere in spannenden Bereichen zu starten. Und das ist erst der Anfang! Mit unseren vielfältigen Weiterbildungsmöglichkeiten wächst du stetig weiter. Mit unserem Programm Bologna@Telekom bieten wir dir die Möglichkeit, nach deinem Abschluss bei der Telekom berufsbegleitend zu studieren. Dazu arbeiten wir mit ausgewählten Hochschulen zusammen, die dir eine Vielzahl an Studiengängen anbieten.\n\n\nProfil\n\nBei uns stehst du im Mittelpunkt! Wir gestalten gemeinsam deinen Karriereweg und arbeiten an Projekten, die echten Mehrwert für dich und die Gesellschaft bieten.\n\nUm bei uns richtig durchzustarten, bringst du Folgendes mit:\n- Haupt-/Realschulabschluss, Abitur oder einen vergleichbaren Schulabschluss\n- Interesse an der Telekommunikationsbranche\n- Die Arbeit im Team gefällt dir, du gehst aktiv auf andere Menschen zu und bietest deine Unterstützung an\n- Technische Neuheiten & digitale Medien begeistern dich, du bist am Puls der Zeit und teilst gerne dein Wissen\n- Begeisterung für Computertechnik, Programmieren und mathematisch-technische Aufgaben\n- Du liebst es, Dinge zu analysieren\n- Englischkenntnisse\n- Du hast Spaß am Lernen und hast das Ziel stets fest im Blick\n\n\nDas bieten wir\nAttraktive Vergütung\n1. Jahr 1.287,90 €\n2. Jahr 1.340,90 €\n3. Jahr 1.393,90 €\n\nUrlaubsgeld in Höhe von 255 € sowie ggf. Beteiligung an den Fahrkosten zwischen Wohnung und Ausbildungsstätte.\n\nMietkostenzuschuss: Wenn du wegen deiner Ausbildung umziehen musst, erhältst du ggf. eine monatliche Unterhaltsbeihilfe von bis zu 300 €.\n\nFinanzielle Vorsorge: Bei uns bist du durch du eine betriebliche Altersvorsorge und vermögenswirksame Leistungen schon jetzt für später vorbereitet.\n\nWork-Life-Balance: 30 Tage Urlaub im Jahr und Gesundheitsangebote, die dich fit halten.\n\nFlexibilität: Flexible Arbeitszeiten sowie die Möglichkeit mobil zu arbeiten – damit du Beruf und Privatleben optimal unter einen Hut bekommst.\n\nModerne Ausstattung: Laptop und Smartphone sind bei uns selbstverständlich.\n\nAbwechslungsreiche Einführungsphase: In deinen ersten Tagen erwarten dich spannende Themen, du erhältst die ersten Einblicke in die Telekomwelt und lernst deinen Mitauszubildenden kennen.\n\nMitgestaltung von sozialen und nachhaltigen Projekten: Du hast die Möglichkeit, aktiv an Projekten mitzuwirken, die einen positiven Einfluss auf die Gesellschaft haben und einen bleibenden, persönlichen Fußabdruck hinterlassen.\n\nPersönliche Betreuung: Wir begleiten dich individuell durch deine Ausbildung und bieten maßgeschneiderte Lernangebote sowie moderne Lernplattformen.\n\nZukunftschancen: Nach erfolgreichem Abschluss hast du gute Chancen auf eine Übernahme. Du willst die Welt entdecken? Ein Auslandsaufenthalt ist ebenfalls möglich!\n\nExklusive Vergünstigungen: Zugang zu Telekomverträgen für Mitarbeitende und Angebote bei vielen Partnern sowie Kooperationen mit Fitnessstudios.\n\n\nBewerben war noch nie so einfach!\nEgal ob du noch zur Schule gehst, die Schule bereits absolviert oder dein Studium abgebrochen hast – bei uns bist du willkommen! Wir heißen alle Menschen gleichermaßen willkommen.\n\nEs gibt keine Bewerbungsfristen : Solange du diese Anzeige siehst, sind noch Plätze frei.\n\nD ichen **Entwicklung**\n- Top **Übernahmechancen**\n- Übernahme von **Verantwortung** in tollen Teams\n- **Kennenlerntage&#160;**für einen guten Start\n\nWir freuen uns auf deine Bewerbung!\nBitte nutze das Bewerbungsformular unter **\"Jetzt bewerben\".**\n\nSCHLENK Gruppe • Human Resources • Barnsdorfer Hauptstraße 5 • D-91154 Roth-Barnsdorf\nTel.: +49 (0) 9171 808-0 • [www.schlenk.de/karriere](http://www.schlenk.de/karriere)\n\nBewerbenLink:\n[https://recruitingapp-5440.de.umantis.com/Vacancies/1637/Application/CheckLogin/1](https://recruitingapp-5440.de.umantis.com/Vacancies/1637/Application/CheckLogin/1)", "gaji": "", "persyaratan": "Du bringst mit\nMittlere Reife / Realschulabschluss", "jenis_ausbildung": "Ausbildung | Fachinformatiker/in - Daten- und Prozessanalyse", "deskripsi_perusahaan": "Die Schlenk-Gruppe produziert hoch spezialisierte, chemische Produkte und Halbzeuge für die industrielle Weiterverarbeitung. Mit einem Team von 900 Mitarbeiterinnen und Mitarbeitern weltweit, einem globalen Vertriebsnetz sowie Tochterfirmen und Produktionsstätten im In- und Ausland tragen wir den Ansprüchen eines namhaften, internationalen Kundenstammes Rechnung.", "apa_yang_ditawarkan": "- **Attraktive Vergütung**\n- **Prämien&#160;**für gute Leistungen\n- **Ticket&#160;**für den öffentlichen Nahverkehr\n- **Fitnessstudio**, **Sportplatz&#32;&#160;**und **Kantine**\n- **Azubi-Events**\n- Förderung deiner persönlichen **Entwicklung**\n- Top **Übernahmechancen**\n- Übernahme von **Verantwortung** in tollen Teams\n- **Kennenlerntage&#160;**für einen guten Start", "link_website_perusahaan": "http://www.arbeitsagentur.de", "alamat_email_bewerbung": "", "link_bewerbung": "", "kontak_penanggung_jawab": "01.09.2027", "dokumen_yang_harus_dipenuhi": "", "ba_job_url": "https://www.arbeitsagentur.de/jobsuche/jobdetail/10000-1206754871-S", "scraped_at": "2026-06-11T08:07:52.094100+00:00"}, {"referenznummer": "10000-1205414196-S", "category_id": "fachinformatiker_dpa", "nama_perusahaan" ive Vergütung** :14 überdurchschnittliche Monatsgehälter:1. Ausbildungsjahr 1.355 Euro pro Monat2. Ausbildungsjahr 1.432 Euro pro Monat3. Ausbildungsjahr 1.520 Euro pro Monat(zzgl. monatlich 40 Euro vermögenswirksame Leistungen; Ausbildungsvergütung Stand 01.08.2025)\n- **Sport & Gesundheit** :Betriebssportangebot, Betriebliche Krankenversicherung\n- **Karriere** :Sehr gute Übernahmechancen, vielfältige Entwicklungsmöglichkeiten\n- **Moderne Arbeitsumgebung** :New Work-Elemente, höhenverstellbare Schreibtische, Curved-Bildschirme, Betriebsrestaurant und Cafeteria mit Außenterrassen\n- **Weitere Benefits** :Vergünstigungen für Mitarbeitende, Zuschuss zum Deutschlandticket, Firmenevents und vieles mehr\n\n**Ausbildung und duales Studium** \n\nBei sehr guten Leistungen stehen Ihnen die Möglichkeit eines ausbildungsbegleiteten oder berufsbegleiteten Studiums offen – so können Sie Ihre Praxis im Unternehmen optimal ergänzen. Oder Sie nutzen die individuellen Weiterbildungsangebote unserer Akademie, um sich zusätzlich zu qualifizieren.\n\n**Der Bewerbungsprozess** \n\nBewerben können Sie sich jeweils ab Juli für den Start im nächsten Jahr.Haben Sie uns mit Ihrer Bewerbung überzeugt, lernen wir uns bei einem Videointerview persönlich kennen. Bei der Gelegenheit stellen wir Ihnen auch erste Kontaktpersonen vor.Im weiteren Auswahlverfahren laden wir Sie zum Bewerbertag in unsere Hauptverwaltung ein. Freuen Sie sich auf eine Gruppendiskussion, berufsspezifische Fallbesprechungen und eine offene Fragerunde mit unserer Jugend- und Auszubildendenvertretung. Außerdem knüpfen Sie erste Kontakte zu den Menschen, die unsere Auszubildenden begleiten und lotsen.Wir sind gespannt auf Ihre Bewerbung über unsere Website!Senden Sie uns bitte\n\n- Ihren Lebenslauf,\n- das aktuelle Schulzeugnis (ggf. alle Zeugnisse der Oberstufe) und\n- (falls vorhanden) aussagekräftige Praktikumszeugnisse u. ä.\n\nVielen Dank.\n\n**Bei Fragen wenden Sie sich gerne an:** \nLucas Stahlhofen\nTelefonnummer:\n
